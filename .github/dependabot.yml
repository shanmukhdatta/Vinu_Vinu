version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "nuget"
    directory: "/src/VinuVinu"
    schedule:
      interval: "monthly"
  - package-ecosystem: "nuget"
    directory: "/tests/VinuVinu.Tests"
    schedule:
      interval: "monthly"
  - package-ecosystem: "nuget"
    directory: "/tools/VinuVerifier"
    schedule:
      interval: "monthly"
